name: Sonde L'Equipe (temporaire)
on:
  push:
    paths: [".github/workflows/sonde-lequipe.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sonde
          curl -sS -L -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36" -H "Accept-Language: fr-FR" -o sonde/agenda.html -w "%{http_code} %{size_download}\n" https://www.lequipe.fr/programme-tv/agenda > sonde/statut.txt || true
          gzip -k sonde/agenda.html || true
          rm -f sonde/agenda.html
          git config user.name robot-sport-tv; git config user.email robot-sport-tv@users.noreply.github.com
          git add sonde; git commit -m "Sonde L'Equipe" || true
          git pull --rebase origin main; git push
