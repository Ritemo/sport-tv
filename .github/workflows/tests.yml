name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer les tests
        run: python -m unittest discover tests -v
