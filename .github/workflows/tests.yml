name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lancer les tests
        run: python -m unittest discover tests -v
      - name: Alerte si échec
        if: failure()
        run: |
          SUJET=$(python -c "import json;print(json.load(open('config.json'))['ntfy_alerte'])")
          curl -s -H "Title: Sport TV : tests en échec" -H "Tags: x" -d "Les tests ont échoué après le dernier envoi. Voir l'onglet Actions." "https://ntfy.sh/$SUJET"
